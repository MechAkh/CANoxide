[package]
name = "canoxide"
version = "0.3.0"
edition = "2021"
description = "Portable CANopen bench tester: EDS browser, SDO client, NMT, bus trace"
license = "MIT"
repository = "https://github.com/MechAkh/CANoxide"
publish = false
autobins = false

[lib]
name = "canoxide"
path = "src/lib.rs"

[[bin]]
name = "CANoxide"
path = "src/main.rs"

[[bin]]
name = "canoxide-cli"
path = "src/bin/cli/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.31", default-features = false }
egui_dock = { version = "0.16", features = ["serde"] }
egui_plot = "0.31"
egui-phosphor = { version = "0.9", default-features = false, features = ["regular"] }
rfd = { version = "0.15", default-features = false }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"

[target.'cfg(windows)'.build-dependencies]
# App icon and version resource of both exes (build.rs); uses rc.exe of the
# Windows SDK that MSVC builds already need.
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
# Headless UI tests (accessibility tree); wgpu + snapshot only for the
# ignored offscreen screenshot test.
egui_kittest = { version = "=0.31.1", features = ["eframe", "wgpu", "snapshot"] }
